name: Sawt
# هدف «صوت لايت» في ملف مستقل (Lite/lite.yml)؛ هدف Sowtly أدناه دون تغيير
include:
  - path: Lite/lite.yml
    relativePaths: false
options:
  bundleIdPrefix: com.za7ef
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ar
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
  SawtSD:
    path: Packages/SawtSD
targets:
  Sawt:
    type: application
    platform: iOS
    sources:
      - path: Sawt
        excludes:
          - Resources/Voices
      - path: Sawt/Resources/Voices
        type: folder
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.za7ef.sawt
        PRODUCT_NAME: Sawt
        MARKETING_VERSION: "0.4.4"
        CURRENT_PROJECT_VERSION: "1"  # يتعيّن تلقائيًا من رقم تشغيل الـCI
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sawt/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        OTHER_LDFLAGS: ["-lc++"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "/System/Developer/usr/lib", "/System/Developer/Library/Frameworks", "/System/Developer/Library/PrivateFrameworks"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sawt/Sawt-Bridging-Header.h
    dependencies:
      - target: SawtWidgets
        embed: true
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwift
        product: MLXFFT
      - package: MLXSwift
        product: MLXRandom
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: SherpaOnnx
        product: sherpa-onnx
      - package: SawtSD
        product: StableDiffusion
  SawtWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SawtWidgets
      - path: Shared
    info:
      path: SawtWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sowtly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.za7ef.sawt.widgets
        PRODUCT_NAME: SawtWidgets
        MARKETING_VERSION: "0.4.4"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SKIP_INSTALL: "YES"

schemes:
  Sawt:
    build:
      targets:
        Sawt: all
    archive:
      config: Release

